    <div class="container">
        <a href="../docs.html" class="back">← 返回文档</a>
        <h1>⌨️ 输入法配置</h1>
        
        <div class="step">
            <h3>预装输入法</h3>
            <p>Darling OS 预装了 fcitx5 输入法框架，包含：</p>
            <ul>
                <li>拼音（默认）</li>
                <li>五笔</li>
                <li>Rime 中州韵（高级用户）</li>
            </ul>
        </div>
        
        <div class="step">
            <h3>切换输入法</h3>
            <p>按 <code>Ctrl + Space</code> 切换中英文。</p>
            <p>按 <code>Ctrl + Shift</code> 切换不同输入法。</p>
        </div>
        
        <div class="step">
            <h3>配置输入法</h3>
            <p>打开终端输：<code>fcitx5-configtool</code></p>
            <p>可以添加、删除、排序输入法。</p>
        </div>
        
        <div class="step">
            <h3>如果输入法不生效</h3>
            <p>检查环境变量是否设置：</p>
            <p><code>echo $GTK_IM_MODULE</code></p>
            <p><code>echo $QT_IM_MODULE</code></p>
            <p>应该都显示 <code>fcitx</code>。</p>
        </div>
    </div>
